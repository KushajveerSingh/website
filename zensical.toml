[project]
site_name = "Kushaj Sooch"
site_url = "https://kushaj.com"
site_description = "My personal website."
site_author = "Kushajveer Singh Sooch"
strict = true
not_in_nav = """
"""
extra_css = [
  "styles/extra.css",
]

# repo_url = "https://github.com/KushajveerSingh/website"
# repo_name = "KushajveerSingh/website"
# edit_uri = "edit/main/docs/"

[project.theme]
custom_dir = "overrides"
favicon = "images/favicon.svg"
language = "en"
features = [
  # "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  # "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  # "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
  # "toc.integrate",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/KushajveerSingh"
name = "Kushaj Sooch on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/instagram"
link = "https://www.instagram.com/kushajveersingh"
name = "Kushaj Sooch on Instagram"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.blocks.caption = {}
pymdownx.snippets.auto_append = [
  "includes/abbreviations.md",
]
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tabbed.slugify.object = "pymdownx.slugs.slugify"
pymdownx.tabbed.slugify.kwds.case = "lower"
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
tables = {}

[[project.markdown_extensions.zensical.extensions.preview.configurations]]
targets.include = [
  "*.md"
]

[project.plugins.blog]
post_date_format = "medium"
post_url_format = "{categories}-{slug}"
post_url_max_categories = 1
archive = false
categories = false
authors = false
